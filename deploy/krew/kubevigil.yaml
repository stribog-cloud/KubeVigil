apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: vigil
spec:
  version: v1.0.0
  homepage: https://github.com/stribog-cloud/KubeVigil
  shortDescription: Kubernetes Security Posture Management — scan clusters for misconfigurations
  description: |
    KubeVigil scans Kubernetes clusters and YAML manifests for security
    misconfigurations. It runs 110 security checks across 12 categories,
    maps findings to compliance frameworks (CIS, MITRE ATT&CK, NSA/CISA),
    and outputs reports in 8 formats. Includes auto-remediation with a
    five-ring safety model.
  caveats: |
    This plugin provides the 'kubectl vigil' command.
    Usage:
      kubectl vigil scan                  # Scan live cluster
      kubectl vigil scan -f ./manifests/  # Scan manifests
      kubectl vigil fix ./manifests/      # Preview auto-fixes
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/stribog-cloud/KubeVigil/releases/download/v1.0.0/kubevigil_1.0.0_linux_amd64.tar.gz
      sha256: b8cdbd6a526d8c111e19cb8c664e97c6639e41a247576eca0f98a505c1a7c37e
      bin: kubevigil
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/stribog-cloud/KubeVigil/releases/download/v1.0.0/kubevigil_1.0.0_linux_arm64.tar.gz
      sha256: 768591959ad89c254a71109c696045441ac3925c739fa0be1b7d9ea943d1e01f
      bin: kubevigil
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/stribog-cloud/KubeVigil/releases/download/v1.0.0/kubevigil_1.0.0_darwin_amd64.tar.gz
      sha256: f904ccd1a2d7609bf75e20bcdcc268dcd8b5e0a3ff0fc86382a78590aa282057
      bin: kubevigil
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/stribog-cloud/KubeVigil/releases/download/v1.0.0/kubevigil_1.0.0_darwin_arm64.tar.gz
      sha256: a05fa9e913533c88c6da16551790cf075d183da1eef57f9438517cf4ce4791e4
      bin: kubevigil
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/stribog-cloud/KubeVigil/releases/download/v1.0.0/kubevigil_1.0.0_windows_amd64.zip
      sha256: 9866fab42b6b80672c0ce756be20e7057fa4a8e866c5ecd7cd91961dd66dd2f9
      bin: kubevigil.exe
