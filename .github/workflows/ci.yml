name: CI

# Coverage gate enforcement relocated from inline YAML to Makefile (charter-compliance
# program); see docs/governance/Charter-Compliance-Annex.md §1.3 and ADR-003.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.10.1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Build binary for MCP E2E tests
        run: make build
      - name: Run tests with coverage
        run: make coverage
      - name: Export coverage percent for badge
        id: coverage
        run: |
          COVERAGE=$(awk '/^mode:/ {next} NF >= 3 { stmts += $2 + 0; if (($3 + 0) > 0) covered += $2 + 0 } END { if (stmts > 0) printf "%.1f", covered / stmts * 100; else print "0" }' coverage.out)
          echo "Coverage: ${COVERAGE}%"
          echo "percent=$COVERAGE" >> "$GITHUB_OUTPUT"
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 1248dd902276859b5cdea636aa5ba175
          filename: kubevigil-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 0
          maxColorRange: 100

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Build and smoke test
        run: make smoke
      - name: Cross-compile all release targets
        run: |
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            read -r os arch <<<"$target"
            echo "=== GOOS=$os GOARCH=$arch ==="
            GOOS="$os" GOARCH="$arch" go build ./...
          done
      - name: Vet platform-tagged code (compiles test files too)
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

  # Runtime execution of the Windows-only pathguard implementation. The rest of
  # CI cross-compiles Windows but never runs it; the security-critical
  # workspace-confinement walk (open_windows.go) must be exercised on a real
  # Windows runner, not just built.
  windows-pathguard:
    name: Windows pathguard
    runs-on: windows-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Build (windows/amd64)
        run: go build ./...
      - name: Test pathguard on Windows
        run: go test -count=1 ./internal/pathguard/...

  doc-gates:
    name: Documentation Gates
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Run documentation gates
        run: |
          chmod +x scripts/*.sh
          make doc-gate doc-drift-gate doc-a11y
          make build
          make doc-samples-test

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xz -f gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml -v