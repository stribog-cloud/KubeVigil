name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.10.1
      - name: Run tests
        run: go test -race -count=1 ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push images to GHCR
      id-token: write      # Sigstore keyless signing + provenance OIDC
      attestations: write  # SLSA build provenance attestations
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Set up QEMU (arm64 image builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned exact version: locally validated with the same release config.
          # Deprecation notes: dockers/brews schema migration tracked for post-1.0.
          version: '2.16.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest build provenance (SLSA) — archives
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
      - name: Extract pushed image manifest digest
        id: image-digest
        run: |
          # GoReleaser writes one "Docker Manifest" artifact per docker_manifests
          # entry. Exclude the mutable ":latest" tag (skipped on prerelease tags
          # anyway) and take the version-tag manifest — the digest a consumer
          # gets from `docker pull ghcr.io/.../kubevigil:<version>`.
          digest=$(jq -r '
            [ .[] | select(.type == "Docker Manifest")
                  | select(.name | endswith(":latest") | not)
                  | .extra.Digest ]
            | unique | .[0] // empty
          ' dist/artifacts.json)
          if [ -z "$digest" ]; then
            echo "::error::could not extract the pushed image manifest digest from dist/artifacts.json"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (SLSA) — container image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/stribog-cloud/kubevigil
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true

  krew:
    name: Publish to krew-index
    runs-on: ubuntu-latest
    # Only after the release exists: the bot DOWNLOADS each published archive to
    # compute its sha256, so running it alongside GoReleaser races the upload
    # and fails on a 404.
    needs: release
    # A krew-index PR failing must not fail the release. The binaries, images,
    # signatures and attestations are already published by this point; the plugin
    # listing is downstream distribution and can be retried by hand.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Opens a PR against kubernetes-sigs/krew-index from the bot's own fork,
      # rendering .krew.yaml with this tag and the real asset checksums.
      #
      # WHY THIS JOB EXISTS: the krew-index entry sat at v0.5.0 while this repo
      # shipped v1.5.0 — seven releases and five months stale — because the
      # manifest was only ever updated by hand, once. Artifact Hub mirrors
      # krew-index automatically, so the same single stale entry made TWO public
      # listings advertise a February build, and `kubectl krew install vigil`
      # served it.
      #
      # No token input: the bot is a hosted service that raises the PR from its
      # own account, so nothing here needs write access to krew-index.
      - name: Update krew-index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
