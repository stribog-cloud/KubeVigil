name: Bug Report
description: Report a bug or unexpected behaviour in KubeVigil.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: KubeVigil version
      description: Output of `kubevigil version`
      placeholder: "v0.5.0 (abc1234, 2026-02-19)"
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      description: Output of `kubectl version --short` (if applicable)
      placeholder: "v1.30.2"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `kubevigil scan ...`
        2. Observe error in output
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any error messages or logs.
      render: shell

  - type: dropdown
    id: scan-mode
    attributes:
      label: Scan mode
      options:
        - Live cluster
        - Manifest scan
        - MCP server
        - Other
