# Web frontend: privileged, hostNetwork, latest tag, run as root
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: app-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      hostNetwork: true
      serviceAccountName: default
      automountServiceAccountToken: true
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
              hostPort: 80
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
