# API server: no resource limits, no seccomp, secrets in env
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api
          image: myregistry.io/api
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: true
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: password
---
# API service
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: app-ns
spec:
  type: ClusterIP
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
