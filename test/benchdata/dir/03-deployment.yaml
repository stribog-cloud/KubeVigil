# Worker with no security context, image without tag
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker
  namespace: worker-ns
spec:
  replicas: 5
  selector:
    matchLabels:
      app: background-worker
  template:
    metadata:
      labels:
        app: background-worker
    spec:
      containers:
        - name: worker
          image: python
          command: ["python", "-m", "worker"]
---
# Multi-container deployment: sidecar pattern with mixed issues
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-sidecar
  namespace: worker-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-with-sidecar
  template:
    metadata:
      labels:
        app: app-with-sidecar
    spec:
      containers:
        - name: app
          image: myregistry.io/main-app:latest
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 0
        - name: envoy
          image: envoyproxy/envoy:latest
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
