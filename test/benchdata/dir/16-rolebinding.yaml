# RoleBinding to overprivileged role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-admin-binding
  namespace: app-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: overprivileged-role
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: app-ns
---
# RoleBinding to debug role for external user
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-binding
  namespace: app-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: debug-role
subjects:
  - kind: User
    name: developer@example.com
    apiGroup: rbac.authorization.k8s.io
