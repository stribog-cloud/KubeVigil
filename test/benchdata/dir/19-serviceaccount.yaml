# ServiceAccount with automount true
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app-ns
automountServiceAccountToken: true
---
# ServiceAccount with GKE IAM annotation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-sa
  namespace: data-ns
  annotations:
    iam.gke.io/gcp-service-account: data-proc@my-project.iam.gserviceaccount.com
automountServiceAccountToken: true
---
# ServiceAccount with EKS IAM annotation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: worker-ns
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/worker
automountServiceAccountToken: true
