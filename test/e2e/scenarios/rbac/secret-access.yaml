# E2E Scenario: Role granting read access to secrets
#
# Triggers:
#   - rbac-secret-access (High) — Role grants get, list, and watch
#     on the secrets resource.
#
# Secrets contain credentials, TLS keys, and tokens. Broad read
# access to secrets is a common privilege-escalation path —
# an attacker who can list secrets can harvest every credential
# in the namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kv-e2e-secret-access
  namespace: kv-e2e-rbac
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
# Binding to keep the role in use
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kv-e2e-secret-access-binding
  namespace: kv-e2e-rbac
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kv-e2e-secret-access
subjects:
  - kind: ServiceAccount
    name: kv-e2e-test-sa
    namespace: kv-e2e-rbac
