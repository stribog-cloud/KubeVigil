# E2E Scenario: ClusterRoleBinding granting cluster-admin to a test SA
#
# Triggers:
#   - rbac-cluster-admin (Critical) — binding references the built-in
#     cluster-admin ClusterRole, which grants full superuser access.
#
# In a real cluster this is the single most dangerous RBAC configuration.
# KubeVigil should flag any binding that references cluster-admin.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kv-e2e-cluster-admin-binding
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kv-e2e-test-sa
    namespace: kv-e2e-rbac
