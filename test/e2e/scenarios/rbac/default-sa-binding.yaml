# E2E Scenario: RoleBinding attaching elevated permissions to the
# default service account
#
# Triggers:
#   - default-service-account (High) — the default SA in every
#     namespace is automatically mounted into pods that do not
#     specify a serviceAccountName. Granting it elevated
#     permissions means every unattributed pod inherits those
#     permissions.
#
# We bind the built-in "edit" ClusterRole to the default SA,
# which grants broad read/write access to most namespaced
# resources.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kv-e2e-default-sa-binding
  namespace: kv-e2e-rbac
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: default
    namespace: kv-e2e-rbac
