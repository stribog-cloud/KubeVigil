# E2E Scenario: Pod-level ServiceAccount configuration issues
#
# Triggers:
#   - automount-token        (High)   — pods with
#     automountServiceAccountToken: true, allowing the SA token
#     to be mounted automatically. If the pod is compromised the
#     token is immediately available to the attacker.
#   - token-projection-config (Medium) — pods that do not use
#     projected service account tokens with a bounded lifetime
#     and explicit audience. Without projection, the legacy
#     long-lived token is used.
#
# Two pods are defined:
#   1. kv-e2e-automount-pod   — explicit automount:true, no projected token
#   2. kv-e2e-no-projection-pod — default SA, no projected volume
---
# Pod 1: automountServiceAccountToken explicitly true, uses default SA
# Triggers: automount-token (High), token-projection-config (Medium)
apiVersion: v1
kind: Pod
metadata:
  name: kv-e2e-automount-pod
  namespace: kv-e2e-rbac
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
    app.kubernetes.io/component: automount-test
spec:
  serviceAccountName: default
  automountServiceAccountToken: true
  containers:
    - name: app
      image: nginx:1.25
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
---
# Pod 2: No projected service account token volume, uses default SA
# Triggers: token-projection-config (Medium)
apiVersion: v1
kind: Pod
metadata:
  name: kv-e2e-no-projection-pod
  namespace: kv-e2e-rbac
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
    app.kubernetes.io/component: projection-test
spec:
  serviceAccountName: kv-e2e-test-sa
  containers:
    - name: app
      image: nginx:1.25
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
  # NOTE: No projected volume with serviceAccountToken source.
  # The pod relies on the legacy long-lived token mount.
