# E2E scenario: ConfigMap containing values that look like secrets.
#
# Triggers: secrets-in-configmap (High)
#
# The secrets-in-configmap checker uses three detection strategies in order:
#
#   1. Key name matching -- keys containing substrings like "password", "token",
#      "api_key", "secret", "auth", "credentials", "access_key", etc.
#   2. Known pattern matching -- values starting with "eyJ" (JWT), "AKIA" (AWS),
#      "ghp_" (GitHub PAT), "-----BEGIN...PRIVATE KEY", etc.
#   3. Entropy analysis -- values with Shannon entropy > 4.5 bits/char and
#      length >= 16, excluding keys that look like config filenames.
#
# Strategies are checked in order; the first match wins (with "continue").
# Each data entry below is crafted to trigger exactly one strategy.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-sensitive
  namespace: kv-e2e-secrets
  labels:
    app: configmap-secrets-demo
data:
  # Strategy 1: Key name matching.
  # The key "db_password" contains the substring "password", which is in the
  # secretKeyPatterns list. The value content does not matter for this strategy.
  db_password: "supersecret123"

  # Strategy 2: Known pattern matching -- JWT token.
  # The key "jwt_data" does NOT match any secretKeyPatterns substring, so
  # Strategy 1 is skipped. The value starts with "eyJ" which matches the
  # JWT prefix in HasKnownSecretPattern().
  jwt_data: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc"

  # Strategy 2: Known pattern matching -- AWS access key.
  # The key "cloud_id" does NOT match any secretKeyPatterns substring.
  # The value starts with "AKIA" which matches the AWS key prefix pattern.
  cloud_id: "AKIAIOSFODNN7EXAMPLE"

  # Strategy 3: Entropy analysis.
  # The key "config_data" does not match any secretKeyPatterns substring
  # (Strategy 1 skipped). The value does not match any known secret prefix
  # (Strategy 2 skipped). The key does not end in a config file extension,
  # so IsConfigFileKey() returns false. Shannon entropy of this value is
  # ~5.0 bits/char (above the 4.5 threshold) and length is 33 (above the
  # 16 char minimum). This triggers IsLikelySecret().
  config_data: "aB3kR9mZ2xQ7pL5nW8hJ4vT6yU1cF0gD"

  # Safe entry -- should NOT trigger any finding.
  # Low entropy, short value, non-sensitive key name.
  log_level: "info"
