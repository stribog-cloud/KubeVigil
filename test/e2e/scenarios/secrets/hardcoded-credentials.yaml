# E2E scenario: Secrets with hardcoded credential values in manifests.
#
# Triggers: secrets-hardcoded-manifests (High)
#
# The secrets-hardcoded-manifests checker examines Secret resources for values
# that appear to be real credentials. It checks:
#   - .data values: base64-decoded, then checked for known patterns or high entropy
#   - .stringData values: checked directly for known patterns or high entropy
#
# Detection uses the same strategies as secrets-in-configmap:
#   1. Known pattern matching (JWT "eyJ", AWS "AKIA", GitHub "ghp_", etc.)
#   2. Entropy analysis (Shannon entropy > 4.5 bits/char AND length >= 16)
#
# IMPORTANT: This checker is manifest-only (ScanModeManifest). It targets
# credentials committed to source control. In live mode, secrets are already
# stored in etcd and this check does not apply.
#
# Note: The user-facing scenario also includes a Deployment that consumes these
# secrets, but the checker itself only analyzes Secret resources, not Deployments.
---
apiVersion: v1
kind: Secret
metadata:
  name: hardcoded-api-credentials
  namespace: kv-e2e-secrets
  labels:
    app: hardcoded-creds-demo
type: Opaque
data:
  # Finding 1: JWT token in .data (known pattern -- starts with "eyJ" after decode).
  # Decoded value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.sig
  api-token: ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LnBheWxvYWQuc2ln
  # Finding 2: AWS access key in .data (known pattern -- starts with "AKIA" after decode).
  # Decoded value: AKIAIOSFODNN7EXAMPLE
  aws-access-key: QUtJQUlPU0ZPRE5ON0VYQU1QTEU=
  # Finding 3: High-entropy password in .data (entropy ~5.0 bits/char, length 32).
  # Decoded value: aB3kR9mZ2xQ7pL5nW8hJ4vT6yU1cF0gD
  db-password: YUIza1I5bVoyeFE3cEw1blc4aEo0dlQ2eVUxY0YwZ0Q=
---
apiVersion: v1
kind: Secret
metadata:
  name: hardcoded-stringdata-credentials
  namespace: kv-e2e-secrets
  labels:
    app: hardcoded-creds-demo
type: Opaque
# stringData values are plaintext -- the checker analyzes them directly without
# base64 decoding.
stringData:
  # Finding 4: GitHub personal access token (known pattern -- starts with "ghp_").
  github-token: "ghp_xK9mZ2pL5nW8hJ4vT6yU1cF0gDaB3kR9"
  # Finding 5: High-entropy connection string (entropy > 4.5, length > 16).
  connection-string: "aB3kR9mZ2xQ7pL5nW8hJ4vT6yU1cF0gD"
---
# Deployment that consumes the hardcoded secrets.
# The Deployment itself does NOT trigger secrets-hardcoded-manifests (which only
# examines Secret resources), but it provides realistic context: these secrets
# are actively used by workloads, making the hardcoded values even more risky.
#
# Note: The secretKeyRef env vars below WILL trigger secrets-in-env (Medium)
# as a secondary finding, since they pass secrets via environment variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-hardcoded-secrets
  namespace: kv-e2e-secrets
  labels:
    app: hardcoded-creds-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hardcoded-creds-demo
  template:
    metadata:
      labels:
        app: hardcoded-creds-demo
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - containerPort: 8080
          env:
            # References the hardcoded Secret -- triggers secrets-in-env too.
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hardcoded-api-credentials
                  key: api-token
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hardcoded-api-credentials
                  key: aws-access-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hardcoded-api-credentials
                  key: db-password
          # Hardcoded password in command args -- visible in process listings.
          # This is a security concern but is NOT detected by secrets-hardcoded-manifests
          # (which only scans Secret resources). Noted here for scenario realism.
          command: ["sh", "-c", "echo starting app"]
