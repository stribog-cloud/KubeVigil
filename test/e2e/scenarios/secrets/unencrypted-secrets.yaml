# E2E scenario: Standard Kubernetes Secret objects.
#
# Triggers:
#   - secrets-unencrypted (Critical) -- live-only check. When scanning a Kind
#     cluster (which is self-managed, not EKS/GKE/AKS), the checker cannot
#     verify that EncryptionConfiguration is enabled for etcd. It emits an
#     advisory finding for the entire cluster (not per-Secret). The mere
#     existence of Secret resources in the cluster adds weight to the finding.
#
#   - secrets-default-type (Low) -- detects Opaque-typed Secrets whose data
#     keys suggest a more specific built-in type. The first Secret below uses
#     Opaque with keys "username" + "password", which should be
#     kubernetes.io/basic-auth. The second uses Opaque with keys "tls.crt" +
#     "tls.key", which should be kubernetes.io/tls.
#
# Note: secrets-unencrypted is a cluster-level heuristic check. It does NOT
# examine individual Secret resources -- it checks whether the cluster appears
# to be managed (EKS/GKE/AKS labels on namespaces). Kind clusters lack those
# labels, so the check fires. These Secret resources exist so that the cluster
# has something meaningful to protect.
---
apiVersion: v1
kind: Secret
metadata:
  name: db-auth-opaque
  namespace: kv-e2e-secrets
  labels:
    app: unencrypted-secrets-demo
# Opaque type with username+password keys.
# secrets-default-type will recommend kubernetes.io/basic-auth.
type: Opaque
data:
  # "admin" base64-encoded
  username: YWRtaW4=
  # "changeme" base64-encoded
  password: Y2hhbmdlbWU=
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert-opaque
  namespace: kv-e2e-secrets
  labels:
    app: unencrypted-secrets-demo
# Opaque type with tls.crt+tls.key keys.
# secrets-default-type will recommend kubernetes.io/tls.
type: Opaque
data:
  # "-----BEGIN CERTIFICATE-----\nMIIBkTCB..." base64-encoded (placeholder)
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJrVENCLi4u
  # "-----BEGIN RSA PRIVATE KEY-----\nMIIBog..." base64-encoded (placeholder)
  tls.key: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpNSUlCb2cu
---
apiVersion: v1
kind: Secret
metadata:
  name: properly-typed-secret
  namespace: kv-e2e-secrets
  labels:
    app: unencrypted-secrets-demo
# This Secret uses the correct type -- secrets-default-type should NOT flag it.
type: kubernetes.io/basic-auth
data:
  # "operator" base64-encoded
  username: b3BlcmF0b3I=
  # "s3cure-p4ss" base64-encoded
  password: czNjdXJlLXA0c3M=
