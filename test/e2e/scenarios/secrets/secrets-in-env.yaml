# E2E scenario: Secrets passed via environment variables.
#
# Triggers: secrets-in-env (Medium)
#
# The secrets-in-env checker flags containers that use env[].valueFrom.secretKeyRef
# to inject secret values as environment variables. Environment variables are visible
# in /proc/*/environ, crash dumps, logs, and child processes. Volume mounts are the
# recommended alternative.
#
# This manifest creates a Secret and a Pod that references it via secretKeyRef in
# three different env vars across a regular container and an init container.
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: kv-e2e-secrets
type: Opaque
data:
  # "dbuser" base64-encoded
  username: ZGJ1c2Vy
  # "changeme123" base64-encoded
  password: Y2hhbmdlbWUxMjM=
  # "postgres://db:5432/app" base64-encoded
  connection-string: cG9zdGdyZXM6Ly9kYjo1NDMyL2FwcA==
---
apiVersion: v1
kind: Pod
metadata:
  name: app-with-secret-env
  namespace: kv-e2e-secrets
  labels:
    app: secret-env-demo
spec:
  # Init container also uses secretKeyRef -- checker should flag it too.
  initContainers:
    - name: db-init
      image: busybox:1.36
      command: ["sh", "-c", "echo Initializing"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
  containers:
    - name: app
      image: nginx:1.25
      ports:
        - containerPort: 8080
      env:
        # Finding 1: secret passed as env var instead of volume mount.
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        # Finding 2: another secret passed as env var.
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        # Finding 3: connection string secret passed as env var.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: connection-string
        # This is fine -- configMapKeyRef is not flagged by secrets-in-env.
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: log-level
