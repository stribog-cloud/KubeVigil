# KubeVigil E2E — Service Account Misconfiguration
#
# Triggers:
#   - default-service-account (High): Pod uses the default ServiceAccount.
#     The checker (internal/checker/rbac/default_service_account.go) flags
#     when serviceAccountName is empty or "default".
#
#   - automount-token (High): Pod auto-mounts a ServiceAccount token.
#     The checker (internal/checker/rbac/automount_token.go) flags when
#     automountServiceAccountToken is nil (defaults to true) or explicitly
#     true.
#
# Note: These checks are in the RBAC checker package but operate on workload
# pod specs, so they are valid E2E targets for workload-security scenarios.
apiVersion: v1
kind: Pod
metadata:
  name: default-sa-automount
  namespace: kv-e2e-workload
  labels:
    app: service-account-test
    kubevigil.stribog.cloud/scenario: workload-security
spec:
  # serviceAccountName is omitted, which defaults to "default"
  # automountServiceAccountToken is omitted, which defaults to true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.9
---
# Explicit defaults for clarity — triggers the same checks.
# Triggers: default-service-account (serviceAccountName is "default")
# Triggers: automount-token (automountServiceAccountToken is true)
apiVersion: v1
kind: Pod
metadata:
  name: explicit-default-sa
  namespace: kv-e2e-workload
  labels:
    app: service-account-test
    kubevigil.stribog.cloud/scenario: workload-security
spec:
  serviceAccountName: default
  automountServiceAccountToken: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.9
