# KubeVigil E2E — Tolerate All Taints
#
# A Deployment with a catch-all toleration (operator: Exists, empty key)
# that matches every taint. This allows scheduling on any node, including
# control-plane, GPU, and isolation-tainted nodes.
#
# Triggers:
#   - toleration-all (Medium): catch-all toleration with operator Exists and no key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolerate-everything
  namespace: kv-e2e-scheduling
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tolerate-everything
  template:
    metadata:
      labels:
        app: tolerate-everything
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
