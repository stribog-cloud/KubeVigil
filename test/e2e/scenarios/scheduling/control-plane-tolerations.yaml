# KubeVigil E2E — Control-Plane Tolerations
#
# A Deployment that tolerates both control-plane and master taints,
# allowing it to schedule on control-plane nodes where only system
# components should run.
#
# Triggers:
#   - toleration-control-plane (High): tolerates node-role.kubernetes.io/control-plane
#   - toleration-control-plane (High): tolerates node-role.kubernetes.io/master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-tolerator
  namespace: kv-e2e-scheduling
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane-tolerator
  template:
    metadata:
      labels:
        app: control-plane-tolerator
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
