# KubeVigil E2E — Scheduling & Availability scenario namespace.
#
# All scheduling scenario manifests deploy into this namespace.
# Apply this file first:
#   kubectl apply -f namespace.yaml
#
# Clean up after testing:
#   kubectl delete namespace kv-e2e-scheduling
apiVersion: v1
kind: Namespace
metadata:
  name: kv-e2e-scheduling
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
    kubevigil.stribog.cloud/scenario: scheduling
