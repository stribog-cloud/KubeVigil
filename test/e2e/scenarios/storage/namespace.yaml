# KubeVigil E2E — Storage Security scenario namespace.
#
# All storage-security scenario manifests deploy into this namespace
# (except PersistentVolumes, which are cluster-scoped).
#
# Apply this file first:
#   kubectl apply -f namespace.yaml
#
# Clean up after testing:
#   kubectl delete namespace kv-e2e-storage
#   kubectl delete pv kv-e2e-hostpath-pv   # PVs are cluster-scoped
apiVersion: v1
kind: Namespace
metadata:
  name: kv-e2e-storage
  labels:
    app.kubernetes.io/part-of: kubevigil-e2e
    kubevigil.stribog.cloud/scenario: storage
