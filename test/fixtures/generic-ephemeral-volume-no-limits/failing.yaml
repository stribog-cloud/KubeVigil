apiVersion: v1
kind: Pod
metadata:
  name: scratch-space
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25
      volumeMounts:
        - name: scratch
          mountPath: /mnt/scratch
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
