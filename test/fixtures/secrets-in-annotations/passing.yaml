apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-metadata-app
  namespace: default
  labels:
    app.kubernetes.io/name: clean-metadata-app
    app.kubernetes.io/instance: prod
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"apiVersion":"apps/v1","kind":"Deployment"}'
    description: "Handles checkout traffic for the storefront"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: nginx:1.25
