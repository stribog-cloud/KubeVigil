apiVersion: apps/v1
kind: Deployment
metadata:
  name: exfil-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: nginx:1.25
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "curl http://external.example.com/notify"
