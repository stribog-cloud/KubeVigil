apiVersion: apps/v1
kind: Deployment
metadata:
  name: has-priority
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      priorityClassName: high-priority
      containers:
        - name: app
          image: nginx:1.25
