apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      volumes:
        - name: cache-volume
          emptyDir: {}
      containers:
        - name: app
          image: nginx:1.25
          volumeMounts:
            - name: cache-volume
              mountPath: /cache
