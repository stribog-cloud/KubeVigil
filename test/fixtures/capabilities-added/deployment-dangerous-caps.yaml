apiVersion: apps/v1
kind: Deployment
metadata:
  name: dangerous-caps-deploy
  namespace: default
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: nginx:1.25
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
                - DAC_OVERRIDE
