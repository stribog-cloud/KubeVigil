apiVersion: apps/v1
kind: Deployment
metadata:
    name: worker
    namespace: processing
    labels:
        app: worker
        tier: backend
spec:
    replicas: 5
    selector:
        matchLabels:
            app: worker
    template:
        metadata:
            labels:
                app: worker
        spec:
            containers:
            -   name: processor
                image: myregistry.io/worker:v1.2.0
                command:
                -   "/bin/worker"
                -   "--config=/etc/worker/config.yaml"
                securityContext:
                    privileged: true
                    runAsUser: 0
                resources:
                    limits:
                        cpu: "2"
                        memory: 1Gi
                    requests:
                        cpu: "500m"
                        memory: 512Mi
