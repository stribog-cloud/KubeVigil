apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: wide-mutator
webhooks:
  - name: wide.example.com
    clientConfig:
      service:
        name: wide-mutator-svc
        namespace: mutator-system
        path: /mutate
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        operations: ["CREATE", "UPDATE"]
    sideEffects: None
    admissionReviewVersions: ["v1"]
