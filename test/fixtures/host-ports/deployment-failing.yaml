apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-port-deploy
  namespace: default
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - containerPort: 80
              hostPort: 8080
