apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolerate-everything
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: app
          image: nginx:1.25
