apiVersion: apps/v1
kind: Deployment
metadata:
  name: trusted-nodes
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: app
          image: nginx:1.25
