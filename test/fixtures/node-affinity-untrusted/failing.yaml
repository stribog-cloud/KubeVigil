apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-targeted
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        node-type: spot
      containers:
        - name: app
          image: nginx:1.25
