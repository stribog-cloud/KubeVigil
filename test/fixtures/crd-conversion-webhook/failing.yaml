apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhooks.example.com
spec:
  group: example.com
  names:
    kind: Webhook
    plural: webhooks
  scope: Namespaced
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        url: https://external.example.com/convert
  versions:
    - name: v1
      served: true
      storage: true
