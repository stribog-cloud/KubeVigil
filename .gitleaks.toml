# Gitleaks configuration for KubeVigil
# Test fixtures contain intentional dummy secrets for testing KubeVigil's
# secret detection checkers. These are not real credentials.

title = "KubeVigil gitleaks config"

[allowlist]
  description = "Allow intentional test fixtures with dummy secrets"
  paths = [
    '''test/fixtures/.*''',
    '''test/e2e/.*''',
    '''test/benchdata/.*''',
    # All *_test.go files in internal/checker/secrets/ (helpers_test.go,
    # secrets_hardcoded_manifests_test.go, secrets_in_configmap_test.go, etc.)
    # contain dummy secret/PEM literals used to exercise the secrets checkers.
    # Scoped to test files only -- production code in this package is never
    # allowlisted.
    '''internal/checker/secrets/.*_test\.go''',
  ]
